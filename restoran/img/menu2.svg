<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" font-family="Georgia,'Times New Roman',serif" fill="#1b2220">
  <rect width="900" height="1200" fill="#fbf7ef"/>
