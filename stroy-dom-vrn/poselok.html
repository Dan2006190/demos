<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<style>
:root{--acc:#c0613a;--acc-d:#97462a;--ink:#1b1d1f;--paper:#fffdfa;--muted:#6b655d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#c6d3dc;font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.ui{position:fixed;z-index:5}
.top{top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(rgba(20,22,24,.55),rgba(20,22,24,0));color:#fff;pointer-events:none}
.top>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font:700 18px/1 "Playfair Display",Georgia,serif}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--acc);font:800 13px/1 Manrope,sans-serif;font-style:normal}
.logo small{display:block;font:600 12px/1.3 Manrope,sans-serif;opacity:.8;margin-top:3px}
.site{margin-left:auto;color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#hint{left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,22,24,.72);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .4s}
#hint.off{opacity:0;pointer-events:none}
#pins{position:fixed;inset:0;pointer-events:none;z-index:4}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;cursor:pointer;background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 11px 8px;box-shadow:0 8px 24px -8px rgba(0,0,0,.45);text-align:left;font:inherit;line-height:1.2;opacity:0;visibility:hidden;transition:opacity .3s,background .2s;will-change:transform}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}
.pin.on{opacity:1;visibility:visible}
.pin b{display:block;font-size:13px;white-space:nowrap}
.pin span{font-size:12px;color:var(--acc-d);font-weight:700;white-space:nowrap}
.pin.hot,.pin:hover{background:var(--acc);color:#fff}.pin.hot span,.pin:hover span{color:#fff}.pin.hot::after,.pin:hover::after{border-top-color:var(--acc)}
#back{top:calc(70px + env(safe-area-inset-top));left:16px;border:0;border-radius:999px;background:var(--paper);color:var(--ink);font:700 14px/1 Manrope,sans-serif;padding:12px 16px;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(-8px);transition:.35s}
#back.on{opacity:1;pointer-events:auto;transform:none}
#card{right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:min(360px,calc(100% - 32px));background:var(--paper);border-radius:20px;padding:20px;box-shadow:0 24px 60px -24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transform:translateY(16px);transition:.45s cubic-bezier(.22,1,.36,1)}
#card.on{opacity:1;pointer-events:auto;transform:none}
#card .k{font:700 11px/1.4 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--acc-d);margin:0 0 6px}
#card h2{font:700 26px/1.1 "Playfair Display",Georgia,serif;margin:0 0 8px}
#c-specs{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:14px;margin-bottom:10px}
#c-specs span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:middle}
#c-price{font:700 28px/1.1 "Playfair Display",Georgia,serif;margin:0 0 4px}
#card .note{font-size:12px;color:var(--muted);margin:0 0 14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;border:0;cursor:pointer}
.btn.acc{background:var(--acc);color:#fff}.btn.gh{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);background:transparent}
.nav{display:flex;justify-content:space-between;margin-top:12px}
.nav button{border:0;background:none;font:700 13px/1 Manrope,sans-serif;color:var(--muted);cursor:pointer;padding:6px 0}
@media(max-width:600px){#card{left:12px;right:12px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom));padding:16px}#card h2{font-size:22px}#c-price{font-size:24px}.site{font-size:13px;padding:8px 12px}}
#loader{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#1b1d1f;color:#f2ede6;transition:opacity .8s}
#loader.off{opacity:0;pointer-events:none}
#loader div{width:min(280px,70vw);text-align:center}
#loader b{font:700 26px/1.2 "Playfair Display",Georgia,serif;display:block;margin-bottom:6px}
#loader p{font-size:14px;color:#a8a199;margin:0 0 18px}
#loader span{display:block;height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
#loader i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.demo{position:fixed;z-index:5;left:16px;bottom:calc(22px + env(safe-area-inset-bottom));font-size:11px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.6);max-width:40vw}
@media(max-width:600px){.demo{display:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Посёлок в 3D: нажмите на дом"></canvas>
<div id="pins"></div>
<header class="ui top"><a class="logo" href="index.html"><i>СД</i><span>Строй Дом<small>Посёлок в 3D</small></span></a><a class="site" href="index.html">На сайт</a></header>
<div class="ui off" id="hint">Нажмите на дом — подлетим поближе</div>
<button class="ui" id="back" type="button">← К посёлку</button>
<aside class="ui" id="card" aria-live="polite">
  <p class="k">Проект</p><h2 id="c-name"></h2><div id="c-specs"></div>
  <div id="c-price"></div><p class="note">Под ключ · крутите дом пальцем или мышью</p>
  <div class="btns"><a class="btn acc" id="c-calc" href="index.html">Рассчитать</a><a class="btn gh" id="c-want" href="index.html">Хочу такой</a></div>
  <div class="nav"><button id="c-prev" type="button">← Предыдущий</button><button id="c-next" type="button">Следующий →</button></div>
</aside>
<div class="demo">Демо: дома построены кодом по параметрам проектов. В рабочей версии — модели ваших проектов.</div>
<div id="loader"><div><b>Строим посёлок…</b><p>Пара секунд — собираем дома и деревья</p><span><i></i></span></div></div>

</html>
